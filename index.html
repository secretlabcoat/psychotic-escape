<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Psychotic!</title>
  <style>
    html, body { margin: 0; padding: 0; background: #0a0a0a; height: 100%; overflow: hidden; font-family: system-ui, sans-serif; }
    .emscripten_border {
      position: fixed; inset: 0;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }
    canvas.emscripten {
      border: 0; background: #111;
      position: absolute; top: 0; left: 0; margin: 0;
      width: 100%; height: 100%; display: block;
    }
    #download-modal {
      background: #1a1210; border: 1px solid #5c2a2a; border-radius: 10px;
      display: none; left: 50%; bottom: 12%; transform: translateX(-50%);
      position: absolute; width: min(400px, 90%); z-index: 10; color: #f2e6e0;
      box-shadow: 0 8px 32px rgba(0,0,0,.55);
    }
    #download-modal-title { background: #3a1818; margin: 0; padding: 10px 16px; text-align: center; border-radius: 10px 10px 0 0; }
    #download-modal-title h3 { margin: 0; font-size: 14px; font-weight: 600; }
    #download-modal-content { padding: 16px; }
    #download-modal p { margin: 8px 0; font-size: 12px; color: #d9c8c0; }
    #download-modal-progress { background: #2a1a18; border-radius: 4px; height: 12px; overflow: hidden; }
    #download-modal-progress-fill { background: #c43c3c; height: 100%; width: 0%; }
    #hint {
      position: fixed; top: 10px; left: 50%; transform: translateX(-50%);
      color: #a89890; font-size: 12px; z-index: 5; pointer-events: none;
      text-shadow: 0 1px 2px #000; opacity: .9; max-width: 90%; text-align: center;
    }
  </style>
</head>
<body>
  <div id="hint">Psychotic!</div>
  <div id="download-modal">
    <div id="download-modal-title"><h3></h3></div>
    <div id="download-modal-content">
      <div id="download-modal-progress"><div id="download-modal-progress-fill"></div></div>
      <p id="download-modal-progress-text">Downloaded 0 KB / 0 MB</p>
      <p id="download-modal-speed-text">Download speed: 0 MB/s</p>
    </div>
  </div>
  <div class="emscripten_border">
    <canvas class="emscripten" id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
  </div>
  <script>
    // GitHub Pages (and any subpath host): ScummVM HTTP FS fetches absolute /data/... URLs.
    (function () {
      var base = new URL('.', document.baseURI).pathname.replace(/\/$/, '');
      if (!base || base === '/') return;
      var orig = window.fetch.bind(window);
      window.fetch = function (input, init) {
        if (typeof input === 'string' && input.charAt(0) === '/' && input.indexOf('/data') === 0) {
          input = base + input;
        } else if (typeof Request !== 'undefined' && input instanceof Request) {
          try {
            var u = new URL(input.url);
            if (u.origin === location.origin && u.pathname.indexOf('/data') === 0) {
              input = new Request(base + u.pathname + u.search + u.hash, input);
            }
          } catch (e) {}
        }
        return orig(input, init);
      };
    })();

    var Module = {
      arguments: [
        '--path=/data/games/psychotic',
        '--auto-detect',
        '--extrapath=/data',
        '--themepath=/data',
        '--iconspath=/data'
      ],
      preRun: [],
      postRun: [],
      print: function (text) {
        console.log(text);
        var h = document.getElementById('hint');
        if (h && text && text.length < 120) h.textContent = text;
      },
      printErr: function (text) { console.error(text); },
      canvas: (function () {
        var canvas = document.getElementById('canvas');
        canvas.addEventListener('webglcontextlost', function (e) {
          alert('WebGL context lost — reload the page.');
          e.preventDefault();
        }, false);
        return canvas;
      })(),
      setStatus: function (text) {
        if (!Module.setStatus.last) Module.setStatus.last = '';
        document.getElementById('download-modal').style.display = 'block';
        if (text === Module.setStatus.last) return;
        Module.setStatus.last = text;
        if (text && text.length > 0) {
          document.getElementById('download-modal-title').firstChild.innerHTML = text;
          document.getElementById('hint').textContent = text;
        } else {
          document.getElementById('download-modal').style.display = 'none';
          document.getElementById('download-modal-progress-fill').style.width = '0%';
        }
      },
      onRuntimeInitialized: function () {
        if (typeof httpHideProgressBar === 'function') httpHideProgressBar();
        document.getElementById('hint').textContent =
          'Psychotic! — click the screen, then CLICK HERE TO BEGIN. Type LOOK and press Enter.';
      },
      totalDependencies: 0,
      monitorRunDependencies: function (left) {
        this.totalDependencies = Math.max(this.totalDependencies, left);
        Module.setStatus(left
          ? 'Preparing… (' + (this.totalDependencies - left) + '/' + this.totalDependencies + ')'
          : 'All downloads complete.');
      }
    };
  </script>
  <script src="scummvm.js"></script>
</body>
</html>
